services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  library-storage-init:
    image: postgres:16-alpine
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 1654:1654 /library-storage && chmod 0750 /library-storage"]
    volumes:
      - library_storage:/library-storage

  api:
    build:
      context: ..
      dockerfile: apps/licensing-api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Atlas: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ATLAS_LICENSE_SIGNING_KEY_PATH: /run/atlas-secrets/server-signing-key.pk8
      ATLAS_CATALOG_KEYS_PATH: /run/atlas-secrets/catalog-keys.json
      ATLAS_INSTALLER_PATH: /downloads/Instalador-AtlasCad.exe
      ATLAS_UNINSTALLER_PATH: /downloads/Desinstalar-AtlasCad.exe
      ATLAS_LIBRARY_STORAGE_PATH: /library-storage
    volumes:
      - ./secrets:/run/atlas-secrets:ro
      - ./artifacts:/downloads:ro
      - library_storage:/library-storage
    depends_on:
      postgres:
        condition: service_healthy
      library-storage-init:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      ATLAS_LICENSE_API: http://api:8080
      ATLAS_PLAN_MONTHLY_PRICE: ${ATLAS_PLAN_MONTHLY_PRICE}
      ATLAS_PLAN_YEARLY_PRICE: ${ATLAS_PLAN_YEARLY_PRICE}
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

volumes:
  postgres_data:
  library_storage:
  caddy_data:
  caddy_config:
