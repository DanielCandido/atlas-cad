name: CI

on:
  push:
  pull_request:

jobs:
  managed-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Atlas.Core.Tests/Atlas.Core.Tests.csproj
      - run: dotnet test tests/Atlas.Installer.Tests/Atlas.Installer.Tests.csproj
      - run: dotnet run --project tests/Atlas.Licensing.Smoke/Atlas.Licensing.Smoke.csproj
      - shell: powershell
        run: ./scripts/verify-private-assets.ps1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
